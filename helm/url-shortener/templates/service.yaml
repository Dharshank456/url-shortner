apiVersion: v1
kind: Service

metadata:
  name: url-shortener
  namespace: {{ .Values.namespace }}

  labels:
    app: url-shortener

spec:
  type: {{ .Values.service.type }}

  selector:
    app: url-shortener

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
