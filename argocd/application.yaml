apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Dharshank456/url-shortner.git
    targetRevision: main
    path: helm/url-shortener

  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
