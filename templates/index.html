<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ app_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            border-radius:18px;
        }

        .title{
            font-weight:700;
        }

        .info-card{
            background:#f8f9fa;
            border-radius:10px;
            padding:15px;
        }

        .badge{
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4 title">

                        🔗 {{ app_name }}

                    </h2>

                    <p class="text-center text-muted">

                        Production Ready URL Shortener

                    </p>

                    <div class="info-card mb-4">

                        <div class="row">

                            <div class="col-md-6 mb-2">

                                <strong>Environment</strong>

                                <br>

                                <span class="badge bg-success">

                                    {{ app_env }}

                                </span>

                            </div>

                            <div class="col-md-6 mb-2">

                                <strong>Version</strong>

                                <br>

                                <span class="badge bg-primary">

                                    {{ app_version }}

                                </span>

                            </div>

                            <div class="col-md-6 mt-3">

                                <strong>Pod</strong>

                                <br>

                                <code>{{ pod_name }}</code>

                            </div>

                            <div class="col-md-6 mt-3">

                                <strong>Secret Loaded</strong>

                                <br>

                                {% if secret_loaded == "YES" %}

                                <span class="badge bg-success">

                                    YES

                                </span>

                                {% else %}

                                <span class="badge bg-danger">

                                    NO

                                </span>

                                {% endif %}

                            </div>

                        </div>

                    </div>

                    <form action="/shorten" method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Enter URL

                            </label>

                            <input
                                class="form-control"
                                type="url"
                                name="url"
                                placeholder="https://example.com"
                                required
                                autofocus>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Custom Alias (Optional)

                            </label>

                            <input
                                class="form-control"
                                type="text"
                                name="custom_alias"
                                placeholder="my-link">

                            <small class="text-muted">

                                Example:
                                my-link →
                                dharshan.kubeace.in/my-link

                            </small>

                        </div>

                        <div class="d-grid">

                            <button
                                class="btn btn-primary btn-lg"
                                type="submit">

                                Shorten URL

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
