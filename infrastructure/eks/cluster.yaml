apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: url-shortener-cluster
  region: ap-south-1
  version: "1.33"

iam:
  withOIDC: true

managedNodeGroups:
  - name: general
    instanceType: t3.medium

    desiredCapacity: 2
    minSize: 2
    maxSize: 3

    volumeSize: 20

    privateNetworking: false

    ssh:
      allow: false

    labels:
      role: general

    tags:
      project: url-shortener
