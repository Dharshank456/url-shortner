name: URL Shortener CI/CD


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


concurrency:
  group: url-shortener-pipeline
  cancel-in-progress: true


env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: url-shortener
  IMAGE_TAG: ${{ github.sha }}



jobs:

# ---------------------------
# 1. Application Testing
# ---------------------------

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run Tests
      run: |
        pytest -v


# ---------------------------
# 2. Docker Build
# ---------------------------


  build:

    needs: test

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}


    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build Docker Image

      run: |

        docker build \
        -t $ECR_REPOSITORY:$IMAGE_TAG \
        .


# ---------------------------
# 3. Security Scan
# ---------------------------


  security-scan:

    needs: build

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Run Trivy Scan

      uses: aquasecurity/trivy-action@master

      with:

        image-ref: url-shortener:${{ github.sha }}

        format: table

        severity: HIGH,CRITICAL

        exit-code: 0



# ---------------------------
# 4. Push Image to ECR
# ---------------------------


  push-image:


    needs: security-scan

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Code

      uses: actions/checkout@v4



    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}



    - name: Login to ECR

      uses: aws-actions/amazon-ecr-login@v2



    - name: Build Image


      run: |


        docker build \
        -t $ECR_REPOSITORY:$IMAGE_TAG \
        .



    - name: Tag Image


      run: |


        docker tag \
        $ECR_REPOSITORY:$IMAGE_TAG \
        877643335351.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG



    - name: Push Image


      run: |


        docker push \
        877643335351.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG



# ---------------------------
# 5. Update Helm Image Tag
# ---------------------------


  update-helm:


    needs: push-image

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Repository

      uses: actions/checkout@v4



    - name: Update Image Tag


      run: |


        sed -i \
        "s/tag:.*/tag: \"${{ github.sha }}\"/" \
        helm/url-shortener/values.yaml



    - name: Commit Changes


      run: |


        git config --global user.name "github-actions"

        git config --global user.email "github-actions@github.com"


        git add helm/url-shortener/values.yaml


        git commit -m "Update image tag to ${{ github.sha }}" || exit 0


        git push
